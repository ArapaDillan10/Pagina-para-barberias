<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DKBZA Barber Studio | Contacto</title>

  <link rel="stylesheet" href="./css/styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body>


  <!-- NAVBAR -->

  <header class="navbar">

    <div class="nav-container">

      <a href="index.html" class="brand">

        <span class="brand-icon">💈</span>

        <div>
          <span class="brand-name">DKBZA</span>
          <span class="brand-sub">BARBER STUDIO</span>
        </div>

      </a>


      <nav class="nav-links">

        <a href="nosotros.html">Nosotros</a>
        <a href="servicios.html">Servicios</a>
        <a href="staff.html">Staff</a>
        <a href="galeria.html">Galería</a>
        <a href="reservas.html">Reservas</a>
        <a href="resenas.html">Reseñas</a>
        <a href="tienda.html">Tienda</a>
        <a href="contacto.html">Contacto</a>

      </nav>


      <a href="reservas.html" class="btn-blue nav-btn">
        Reservar Turno
      </a>

    </div>

  </header>


  <!-- CONTACTO -->

  <section class="section-card">

    <div class="container grid-contact">


      <!-- INFORMACIÓN -->

      <div>

        <span class="section-tag">
          UBICACIÓN Y CONTACTO
        </span>

        <h1>
          Encontranos en Salta
        </h1>

        <p class="text-subtle">
          calle siempre viva 123
        </p>

        <p class="text-subtle">
          Tel: +54 387 1111 111
        </p>

      </div>


      <!-- FORMULARIO -->

      <form
        id="contact-form"
        class="contact-form"
      >

        <label>
          Nombre
        </label>

        <input
          type="text"
          class="wireframe-input"
          required
        >


        <label>
          Email
        </label>

        <input
          type="email"
          class="wireframe-input"
          required
        >


        <label>
          Mensaje
        </label>

        <textarea
          class="wireframe-input"
          rows="4"
          required
        ></textarea>


        <button
          type="submit"
          class="btn-blue"
        >
          Enviar Mensaje
        </button>

      </form>

    </div>

  </section>


  <!-- FOOTER -->

  <footer class="footer">

    <div class="container footer-content">

      <span>
        © 2026 DKBZA Barber Studio · Todos los derechos reservados
      </span>

      <a href="admin.html" id="admin-login-btn" class="btn-ghost-sm">
        🔒 Admin
      </a>

    </div>

  </footer>


  <script src="./js/script.js"></script>

</body>

</html>
